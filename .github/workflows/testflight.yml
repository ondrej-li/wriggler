name: TestFlight

# Archives a signed build and uploads it to TestFlight.
#
# A tag push always uploads; a manual run uploads unless you untick the box, so
# a run can also just prove that signing works. The six signing secrets are
# documented in docs/TESTFLIGHT.md - without them this fails before the archive,
# naming the one that is missing.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight after archiving
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Archive & upload
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_CONNECT_KEY_ID: ${{ secrets.APP_CONNECT_KEY_ID }}
      APP_CONNECT_ISSUER_ID: ${{ secrets.APP_CONNECT_ISSUER_ID }}
      SHOULD_UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write the App Store Connect key
        run: |
          set -euo pipefail
          if [[ -z "${APP_CONNECT_KEY_ID}" ]]; then
            echo "::error::APP_CONNECT_KEY_ID is not configured - see docs/TESTFLIGHT.md"
            exit 1
          fi
          mkdir -p private_keys
          echo "${APP_CONNECT_KEY_P8}" | base64 --decode > "private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8"
          chmod 600 "private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8"
        env:
          APP_CONNECT_KEY_P8: ${{ secrets.APP_CONNECT_KEY_P8 }}

      - name: Generate the project
        run: xcodegen generate

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild -project Wriggler.xcodeproj -scheme Wriggler \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Wriggler.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "${APP_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_CONNECT_ISSUER_ID}" \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive

      - name: Export the ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Wriggler.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist Support/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$PWD/private_keys/AuthKey_${APP_CONNECT_KEY_ID}.p8" \
            -authenticationKeyID "${APP_CONNECT_KEY_ID}" \
            -authenticationKeyIssuerID "${APP_CONNECT_ISSUER_ID}"

      - name: Upload to TestFlight
        if: ${{ env.SHOULD_UPLOAD == 'true' }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/export/Wriggler.ipa \
            --apiKey "${APP_CONNECT_KEY_ID}" \
            --apiIssuer "${APP_CONNECT_ISSUER_ID}" \
            --apiKeyPath "$PWD/private_keys"

      - name: Keep the ipa
        uses: actions/upload-artifact@v7
        with:
          name: Wriggler-ipa
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 14
